services:
  - name: alert-router
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: WEBHOOK_SHARED_SECRET
        generateValue: true
      - key: DEDUP_WINDOW_MINUTES
        value: "15"
      - key: DATABASE_PATH
        value: /app/data/alerts.db
