# Generated for `fly launch --no-deploy` style deploys. Run `fly launch` from this
# directory and it will offer to use this file; adjust `app` to a name you own.
app = "alert-router-demo"
primary_region = "cdg"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "alert_router_data"
  destination = "/app/data"

[env]
  DEDUP_WINDOW_MINUTES = "15"
